name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# master is the Pages production branch; every other branch name lands on a preview URL.
# A PR only fires the pull_request event here, so a branch never deploys twice.
concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sanjaybhagia-com --branch=${{ github.head_ref || github.ref_name }}

      # Reviews get approved from a phone, so the rendered page has to be one tap from the
      # PR. Sticky comment: edited in place on each push instead of piling up.
      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- cf-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = [
              marker,
              `### Preview: ${url}`,
              '',
              '| | |',
              '| --- | --- |',
              `| Reviews | ${url}/reviews/ |`,
              `| Reading | ${url}/reading/ |`,
              `| Blog | ${url}/blog/ |`,
              '',
              `Commit \`${context.sha.slice(0, 7)}\`. Merging this PR deploys to production.`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
